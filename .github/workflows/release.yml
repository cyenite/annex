name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    permissions:
      contents: write
    # The oldest supported runner, so the binary links against an older glibc and runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      # Pinned to commits, and no build cache: this job can write releases, so nothing it runs
      # may change under a moved tag or a poisoned cache.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # `annex update` compares the tag with the version the binary reports, so a mismatch
      # would make every install look out of date.
      - name: Check the tag matches Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $crate"
            exit 1
          fi
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="annex-${version}-x86_64-linux"
          mkdir "$archive"
          cp target/release/annex README.md LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md "$archive/"
          tar czf "$archive.tar.gz" "$archive"
          sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256"
          # The changelog section for this version becomes the release notes.
          awk -v version="$version" '
            $0 ~ "^## " { if (found) exit; found = ($2 == version) ; next }
            found { print }
          ' CHANGELOG.md > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "annex $GITHUB_REF_NAME" \
            --notes-file notes.md \
            annex-*.tar.gz annex-*.tar.gz.sha256

  manager:
    name: Build and publish Annex Manager
    needs: release
    permissions:
      contents: write
    # libadwaita 1.5, which the Manager targets, first ships with Ubuntu 24.04, so this binary
    # needs a newer system than the CLI's.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: cargo build --release --locked --features manager --bin annex-manager
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="annex-manager-${version}-x86_64-linux"
          mkdir "$archive"
          cp target/release/annex-manager LICENSE THIRD_PARTY_NOTICES.md "$archive/"
          tar czf "$archive.tar.gz" "$archive"
          sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" annex-manager-*.tar.gz annex-manager-*.tar.gz.sha256
